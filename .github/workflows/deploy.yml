name: Build, Push & Deploy to EC2

on:
  push:
    branches: [main]

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

env:
  IMAGE_BACKEND:  ${{ secrets.DOCKER_HUB_USERNAME }}/aris-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKER_HUB_USERNAME }}/aris-frontend

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build & Push Docker images to Docker Hub
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # ── Backend ────────────────────────────────────────────────────────────
      - name: Build & Push — Backend (Laravel)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          # GitHub Actions cache speeds up subsequent builds significantly
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── Frontend ───────────────────────────────────────────────────────────
      - name: Build & Push — Frontend (React/Vite)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          # VITE_API_URL is baked into the static bundle at build time
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — SSH into EC2 and deploy
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "📂 Moving to app directory..."
            cd /opt/aris

            echo "🔐 Logging into Docker Hub..."
            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | \
              docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

            echo "📥 Pulling latest images..."
            docker pull ${{ env.IMAGE_BACKEND }}:latest
            docker pull ${{ env.IMAGE_FRONTEND }}:latest

            echo "♻️  Restarting containers..."
            docker compose up -d --no-build --remove-orphans

            echo "⏳ Waiting for backend to be healthy..."
            sleep 10

            echo "🗄️  Running Laravel post-deploy tasks..."
            docker exec aris-backend php artisan migrate --force
            docker exec aris-backend php artisan config:cache
            docker exec aris-backend php artisan route:cache
            docker exec aris-backend php artisan view:cache
            docker exec aris-backend php artisan storage:link || true

            echo "🧹 Pruning old images..."
            docker image prune -f

            echo "✅ Deployment complete! SHA: ${{ github.sha }}"
