name: Build, Push & Deploy to EC2

on:
  push:
    branches: [feature/docker-ec2-deployment]

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

env:
  IMAGE_BACKEND:  ${{ secrets.ARIS_DOCKER_HUB_USERNAME }}/aris-backend
  IMAGE_FRONTEND: ${{ secrets.ARIS_DOCKER_HUB_USERNAME }}/aris-frontend

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Run Laravel backend tests (blocks build if tests fail)
  # Uses SQLite in-memory — no MySQL service needed (per phpunit.xml config)
  # ────────────────────────────────────────────────────────────────────────────
  backend-tests:
    name: 🧪 Backend Tests (Laravel)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aris-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, zip, exif, bcmath, gd, pcntl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: aris-backend/vendor
          key: composer-${{ hashFiles('aris-backend/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env for testing
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run PHPUnit tests
        run: php artisan test --parallel --stop-on-failure

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build & Push Docker images to Docker Hub
  # Only runs if backend-tests passes
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.ARIS_DOCKER_HUB_USERNAME }}
          password: ${{ secrets.ARIS_DOCKER_HUB_TOKEN }}

      # ── Backend ────────────────────────────────────────────────────────────
      - name: Build & Push — Backend (Laravel)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          # GitHub Actions cache speeds up subsequent builds significantly
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── Frontend ───────────────────────────────────────────────────────────
      - name: Build & Push — Frontend (React/Vite)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          # ARIS_VITE_API_URL secret must be set to: https://www.aris.thilinarodrigo.me/api
          build-args: |
            VITE_API_URL=${{ secrets.ARIS_VITE_API_URL }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — SSH into EC2 and deploy
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.ARIS_EC2_HOST }}
          username: ${{ secrets.ARIS_EC2_USER }}
          key:      ${{ secrets.ARIS_EC2_SSH_PRIVATE_KEY }}
          # Pass secrets as environment variables into the SSH session
          envs: ARIS_ENV_FILE,ARIS_DOCKER_HUB_USERNAME,ARIS_DOCKER_HUB_TOKEN,IMAGE_BACKEND,IMAGE_FRONTEND
          script: |
            set -e

            echo "📂 Moving to app directory..."
            cd /opt/aris

            # ── Write .env file from GitHub Secret ────────────────────────────
            # The entire content of your production .env is stored in ARIS_ENV_FILE.
            # This overwrites /opt/aris/.env on every deploy (keeps it in sync).
            echo "📝 Writing .env file..."
            printf '%s' "$ARIS_ENV_FILE" > /opt/aris/.env
            chmod 600 /opt/aris/.env

            # ── Log in to Docker Hub ─────────────────────────────────────────
            echo "🔐 Logging into Docker Hub..."
            echo "$ARIS_DOCKER_HUB_TOKEN" | \
              docker login -u "$ARIS_DOCKER_HUB_USERNAME" --password-stdin

            # ── Pull latest images ───────────────────────────────────────────
            echo "📥 Pulling latest images..."
            docker pull $IMAGE_BACKEND:latest
            docker pull $IMAGE_FRONTEND:latest

            # ── Restart containers ───────────────────────────────────────────
            echo "♻️  Restarting containers..."
            docker compose up -d --no-build --remove-orphans

            echo "⏳ Waiting for backend to be healthy..."
            sleep 10

            # ── Laravel post-deploy tasks ────────────────────────────────────
            echo "🗄️  Running Laravel post-deploy tasks..."
            docker exec aris-backend php artisan migrate --force
            docker exec aris-backend php artisan config:cache
            docker exec aris-backend php artisan route:cache
            docker exec aris-backend php artisan view:cache
            docker exec aris-backend php artisan storage:link || true

            # ── Clean up old images ──────────────────────────────────────────
            echo "🧹 Pruning old images..."
            docker image prune -f

            echo "✅ Deployment complete! SHA: ${{ github.sha }}"
