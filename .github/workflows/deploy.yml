name: CI/CD — Test, Build & Deploy to EC2

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  push:
    branches: [feature/docker-ec2-deployment]
  workflow_dispatch:          # Allow manual run from GitHub Actions UI

# ─── Shared image name variables ─────────────────────────────────────────────
env:
  IMAGE_BACKEND:  ${{ secrets.ARIS_DOCKER_HUB_USERNAME }}/aris-backend
  IMAGE_FRONTEND: ${{ secrets.ARIS_DOCKER_HUB_USERNAME }}/aris-frontend

# ─────────────────────────────────────────────────────────────────────────────
jobs:

# ╔══════════════════════════════════════════════════════════════════════════════
# ║  JOB 1 — Backend Tests
# ║  Runs PHPUnit against SQLite in-memory (no MySQL needed)
# ║  Blocks the entire pipeline if any test fails
# ╚══════════════════════════════════════════════════════════════════════════════
  backend-tests:
    name:  Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aris-backend

    steps:
      - name:  Checkout repository
        uses: actions/checkout@v4

      - name:  Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, zip, exif, bcmath, gd, pcntl
          coverage: none

      - name:  Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: aris-backend/vendor
          key: composer-${{ hashFiles('aris-backend/composer.lock') }}
          restore-keys: composer-

      - name:  Install Composer dependencies (with dev for PHPUnit)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name:  Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name:  Run PHPUnit test suite
        run: php artisan test --parallel --stop-on-failure


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  JOB 2 — Frontend CI
# ║  Runs ESLint + TypeScript type-check in parallel with backend-tests
# ║  Blocks frontend build if lint or types fail
# ╚══════════════════════════════════════════════════════════════════════════════
  frontend-ci:
    name: Frontend CI (Lint & Types)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aris-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aris-frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type-check
        run: npx tsc --noEmit


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  JOB 3 — Build & Push Backend Image
# ║  Builds the Laravel Docker image and pushes to Docker Hub
# ║  Runs only after backend-tests passes
# ╚══════════════════════════════════════════════════════════════════════════════
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name:  Checkout repository
        uses: actions/checkout@v4

      - name:  Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name:  Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.ARIS_DOCKER_HUB_USERNAME }}
          password: ${{ secrets.ARIS_DOCKER_HUB_TOKEN }}

      - name:  Build & push Laravel image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  JOB 4 — Build & Push Frontend Image
# ║  Builds the React/Vite Docker image and pushes to Docker Hub
# ║  Runs only after frontend-ci passes
# ╚══════════════════════════════════════════════════════════════════════════════
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: frontend-ci

    steps:
      - name:  Checkout repository
        uses: actions/checkout@v4

      - name:  Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name:  Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.ARIS_DOCKER_HUB_USERNAME }}
          password: ${{ secrets.ARIS_DOCKER_HUB_TOKEN }}

      - name:  Build & push React/Vite image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          # VITE_ vars are baked into the bundle at build time (not runtime)
          # ARIS_VITE_API_URL = https://www.aris.thilinarodrigo.me/api
          build-args: |
            VITE_API_URL=${{ secrets.ARIS_VITE_API_URL }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  JOB 4 — Deploy to EC2
# ║  SSHs into the EC2 instance and performs a rolling update
# ║  Runs only after BOTH build jobs succeed
# ╚══════════════════════════════════════════════════════════════════════════════
  deploy:
    name:  Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name:  SSH into EC2 & deploy
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.ARIS_EC2_HOST }}
          username: ${{ secrets.ARIS_EC2_USER }}
          key:      ${{ secrets.ARIS_EC2_SSH_PRIVATE_KEY }}
          envs:     ARIS_ENV_FILE,ARIS_DOCKER_HUB_USERNAME,ARIS_DOCKER_HUB_TOKEN,IMAGE_BACKEND,IMAGE_FRONTEND
          script: |
            set -e
            cd /opt/aris

            echo "━━━ [1/6] Writing production .env ━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            printf '%s' "$ARIS_ENV_FILE" > /opt/aris/.env
            chmod 600 /opt/aris/.env

            echo "━━━ [2/6] Logging into Docker Hub ━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "$ARIS_DOCKER_HUB_TOKEN" | docker login -u "$ARIS_DOCKER_HUB_USERNAME" --password-stdin

            echo "━━━ [3/6] Pulling latest images ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            docker pull $IMAGE_BACKEND:latest
            docker pull $IMAGE_FRONTEND:latest

            echo "━━━ [4/6] Starting containers ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            docker compose up -d --no-build --remove-orphans
            echo " Waiting for backend to be healthy (10s)..."
            sleep 10

            echo "━━━ [5/6] Running Laravel post-deploy tasks ━━━━━━━━━━━━━━━━━"
            docker exec aris-backend php artisan migrate --force
            docker exec aris-backend php artisan config:cache
            docker exec aris-backend php artisan route:cache
            docker exec aris-backend php artisan view:cache
            docker exec aris-backend php artisan storage:link || true

            echo "━━━ [6/6] Cleaning up old Docker images ━━━━━━━━━━━━━━━━━━━━━"
            docker image prune -f

            echo ""
            echo " Deployment complete!"
            echo "   SHA : ${{ github.sha }}"
            echo "   URL : https://www.aris.thilinarodrigo.me"
