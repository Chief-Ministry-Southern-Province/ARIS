# ─────────────────────────────────────────────────────────────────────────────
# Nginx Host-Level Reverse Proxy
# Installed on EC2 directly (not inside Docker).
# Proxies public traffic to the frontend (3000) and backend (8000) containers.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Certbot will rewrite this to HTTPS redirect automatically
    # after running: sudo certbot --nginx -d yourdomain.com

    client_max_body_size 50M;

    # ─── Frontend (React SPA) ────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade      $http_upgrade;
        proxy_set_header   Connection   'upgrade';
        proxy_set_header   Host         $host;
        proxy_set_header   X-Real-IP    $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # ─── Backend API (Laravel) ───────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── Laravel Sanctum CSRF cookie ────────────────────────────────────────
    location /sanctum/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── Laravel Reverb (WebSocket) ─────────────────────────────────────────
    location /app/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # ─── Laravel storage public files ────────────────────────────────────────
    location /storage/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}
