# Nginx config for serving the React SPA inside the frontend container
# This runs on port 3000 INSIDE Docker; host Nginx proxies to it.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # React Router — all unknown paths fall back to index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressive caching for hashed assets (Vite adds content hashes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # PWA service worker — must never be cached
    location ~* (service-worker\.js|sw\.js|workbox-.+\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN"       always;
    add_header X-Content-Type-Options "nosniff"   always;
    add_header Referrer-Policy "strict-origin"    always;
}
